services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orvo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orvo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:2.11-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    env_file:
      - apps/app/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/orvo
      ORIGIN: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 3000
    command: ["sh", "-c", "pnpm --filter @repo/db db:migrate && node build"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  ingest:
    build:
      context: ./apps/ingest
      dockerfile: Dockerfile
    env_file:
      - apps/ingest/.env
    environment:
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/orvo
      NATS_URL: nats://nats:4222
      INGEST_HTTP_HOST: 0.0.0.0
      INGEST_HTTP_PORT: 4318
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "4318:4318"

volumes:
  postgres_data:
