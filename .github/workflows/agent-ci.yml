name: Agent CI

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: |
            apps/agent/go.mod
            apps/agent/builder-config.yaml

      - name: Test
        working-directory: apps/agent
        run: go test -race ./...

      - name: Vet
        working-directory: apps/agent
        run: go vet ./...

      - name: Build distribution
        working-directory: apps/agent
        run: make build AGENT_VERSION=ci

      - name: Cross-compile supported Linux targets
        working-directory: apps/agent
        shell: bash
        run: |
          for arch in amd64 arm64; do
            (
              cd build/runtime
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                -trimpath -ldflags='-s -w' -o "../orvo-agent-linux-${arch}" .
            )
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath -ldflags='-s -w -X main.version=ci' \
              -o "build/orvo-agentctl-linux-${arch}" ./cmd/orvo-agentctl
          done

      - name: Verify clean source tree
        run: git diff --exit-code
