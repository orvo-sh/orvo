name: Local Release

on:
  push:
    tags:
      - "local-v*.*.*"

concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^local-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Local release tags must match local-vX.Y.Z." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#local-v}"
          test -s "apps/local/releases/v${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/local/go.mod
          cache-dependency-path: |
            apps/local/go.sum
            apps/ingest/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: ORVO_MODE=local pnpm --filter app build

      - name: Build distribution
        working-directory: apps/local
        run: make build-release VERSION=${{ needs.prepare.outputs.version }}

      - name: Name distribution
        id: artifact
        working-directory: apps/local
        shell: bash
        run: |
          NAME="orvo_${{ needs.prepare.outputs.version }}_$(go env GOOS)_$(go env GOARCH)"
          mv build/orvo "build/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/local/build/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: orvo_*
          path: apps/local/dist
          merge-multiple: true

      - name: Build checksums
        working-directory: apps/local/dist
        run: sha256sum orvo_* > checksums.txt

      - name: Publish GitHub release
        working-directory: apps/local
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/orvo_* dist/checksums.txt \
            --latest=false \
            --verify-tag \
            --title "Orvo Local ${VERSION}" \
            --notes-file "releases/v${VERSION}.md"
