name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orvo-app:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orvo-app:latest

      - name: Build and push ingest image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ingest
          file: apps/ingest/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orvo-ingest:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orvo-ingest:latest

      - name: Build and push telemetry writer image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/telemetry-writer
          file: apps/telemetry-writer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orvo-telemetry-writer:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orvo-telemetry-writer:latest

      - name: Build and push alerts worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/alerts-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orvo-alerts-worker:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orvo-alerts-worker:latest

      - name: Prepare deploy assets
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/orvo-app:sha-${{ github.sha }}
          INGEST_IMAGE: ghcr.io/${{ github.repository_owner }}/orvo-ingest:sha-${{ github.sha }}
          TELEMETRY_WRITER_IMAGE: ghcr.io/${{ github.repository_owner }}/orvo-telemetry-writer:sha-${{ github.sha }}
          ALERTS_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/orvo-alerts-worker:sha-${{ github.sha }}
          PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
          PROD_CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
          PROD_BETTER_AUTH_SECRET: ${{ secrets.PROD_BETTER_AUTH_SECRET }}
          PROD_POSTGRES_CA_CERT: ${{ secrets.PROD_POSTGRES_CA_CERT }}
          PROD_GITHUB_CLIENT_ID: ${{ secrets.PROD_GITHUB_CLIENT_ID }}
          PROD_GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
          PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          PROD_RESEND_FROM_EMAIL: ${{ secrets.PROD_RESEND_FROM_EMAIL }}
          PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          PROD_STRIPE_STARTER_PRICE_ID: ${{ secrets.PROD_STRIPE_STARTER_PRICE_ID }}
          PROD_STRIPE_PRO_PRICE_ID: ${{ secrets.PROD_STRIPE_PRO_PRICE_ID }}
          PROD_BILLING_SALES_EMAIL: ${{ secrets.PROD_BILLING_SALES_EMAIL }}
          PROD_ORVO_PUBLIC_INGESTION_KEY: ${{ secrets.PROD_ORVO_PUBLIC_INGESTION_KEY }}
          PROD_ORVO_PRIVATE_INGESTION_KEY: ${{ secrets.PROD_ORVO_PRIVATE_INGESTION_KEY }}
          PROD_S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          PROD_S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
          PROD_S3_REGION: ${{ secrets.PROD_S3_REGION }}
          PROD_S3_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
          PROD_CDN_BASE_URL: ${{ secrets.PROD_CDN_BASE_URL }}
          PROD_MAX_UPLOAD_SIZE_BYTES: ${{ secrets.PROD_MAX_UPLOAD_SIZE_BYTES }}
          PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
        run: |
          mkdir -p deploy/env deploy/certs

          cat <<EOF > deploy/.env
          APP_IMAGE=${APP_IMAGE}
          INGEST_IMAGE=${INGEST_IMAGE}
          TELEMETRY_WRITER_IMAGE=${TELEMETRY_WRITER_IMAGE}
          ALERTS_WORKER_IMAGE=${ALERTS_WORKER_IMAGE}
          EOF

          cat <<EOF > deploy/env/app.env
          NODE_ENV=production
          HOST=0.0.0.0
          PORT=3000
          ORIGIN=https://app.orvo.sh
          POSTGRES_URL=${PROD_POSTGRES_URL}
          CLICKHOUSE_URL=${PROD_CLICKHOUSE_URL}
          BETTER_AUTH_SECRET=${PROD_BETTER_AUTH_SECRET}
          GITHUB_CLIENT_ID=${PROD_GITHUB_CLIENT_ID}
          GITHUB_CLIENT_SECRET=${PROD_GITHUB_CLIENT_SECRET}
          RESEND_API_KEY=${PROD_RESEND_API_KEY}
          RESEND_FROM_EMAIL=${PROD_RESEND_FROM_EMAIL}
          STRIPE_SECRET_KEY=${PROD_STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${PROD_STRIPE_WEBHOOK_SECRET}
          STRIPE_STARTER_PRICE_ID=${PROD_STRIPE_STARTER_PRICE_ID}
          STRIPE_PRO_PRICE_ID=${PROD_STRIPE_PRO_PRICE_ID}
          BILLING_SALES_EMAIL=${PROD_BILLING_SALES_EMAIL}
          PUBLIC_ORVO_OTLP_BASE_URL=https://ingest.orvo.sh
          PUBLIC_ORVO_PUBLIC_INGESTION_KEY=${PROD_ORVO_PUBLIC_INGESTION_KEY}
          ORVO_OTLP_BASE_URL=http://ingest:4318
          ORVO_PRIVATE_INGESTION_KEY=${PROD_ORVO_PRIVATE_INGESTION_KEY}
          S3_ACCESS_KEY_ID=${PROD_S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${PROD_S3_SECRET_ACCESS_KEY}
          S3_ENDPOINT=${PROD_S3_ENDPOINT}
          S3_REGION=${PROD_S3_REGION}
          S3_BUCKET_NAME=${PROD_S3_BUCKET_NAME}
          CDN_BASE_URL=${PROD_CDN_BASE_URL}
          MAX_UPLOAD_SIZE_BYTES=${PROD_MAX_UPLOAD_SIZE_BYTES}
          ALERTS_ENCRYPTION_KEY=${PROD_BETTER_AUTH_SECRET}
          GEMINI_API_KEY=${PROD_GEMINI_API_KEY}
          EOF

          cat <<EOF > deploy/env/ingest.env
          APP_ENVIRONMENT=production
          POSTGRES_URL=${PROD_POSTGRES_URL}
          CLICKHOUSE_URL=${PROD_CLICKHOUSE_URL}
          NATS_URL=nats://nats:4222
          INGEST_HTTP_HOST=0.0.0.0
          INGEST_HTTP_PORT=4318
          ORVO_OTLP_BASE_URL=http://ingest:4318
          ORVO_PRIVATE_INGESTION_KEY=${PROD_ORVO_PRIVATE_INGESTION_KEY}
          EOF

          cat <<EOF > deploy/env/telemetry-writer.env
          APP_ENVIRONMENT=production
          POSTGRES_URL=${PROD_POSTGRES_URL}
          CLICKHOUSE_URL=${PROD_CLICKHOUSE_URL}
          NATS_URL=nats://nats:4222
          ORVO_OTLP_BASE_URL=http://ingest:4318
          ORVO_PRIVATE_INGESTION_KEY=${PROD_ORVO_PRIVATE_INGESTION_KEY}
          EOF

          cat <<EOF > deploy/env/alerts-worker.env
          NODE_ENV=production
          POSTGRES_URL=${PROD_POSTGRES_URL}
          CLICKHOUSE_URL=${PROD_CLICKHOUSE_URL}
          ALERTS_ENCRYPTION_KEY=${PROD_BETTER_AUTH_SECRET}
          ORVO_OTLP_BASE_URL=http://ingest:4318
          ORVO_PRIVATE_INGESTION_KEY=${PROD_ORVO_PRIVATE_INGESTION_KEY}
          EOF

          printf '%s' "${PROD_POSTGRES_CA_CERT}" | base64 --decode > deploy/certs/do-postgres-ca.crt

      - name: Configure SSH
        env:
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_SERVER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy assets
        run: |
          ssh "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}" 'mkdir -p /opt/orvo/env /opt/orvo/certs'
          scp docker-compose.prod.yml Caddyfile "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/"
          scp deploy/.env "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/.env"
          scp deploy/env/app.env "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/env/app.env"
          scp deploy/env/ingest.env "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/env/ingest.env"
          scp deploy/env/telemetry-writer.env "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/env/telemetry-writer.env"
          scp deploy/env/alerts-worker.env "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/env/alerts-worker.env"
          scp deploy/certs/do-postgres-ca.crt "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/orvo/certs/do-postgres-ca.crt"

      - name: Deploy on server
        env:
          PROD_GHCR_PULL_USERNAME: ${{ secrets.PROD_GHCR_PULL_USERNAME }}
          PROD_GHCR_PULL_TOKEN: ${{ secrets.PROD_GHCR_PULL_TOKEN }}
        run: |
          ssh "${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}" <<EOF
          set -euo pipefail
          cd /opt/orvo
          printf '%s\n' "${PROD_GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${PROD_GHCR_PULL_USERNAME}" --password-stdin
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env run -T --rm --no-deps app sh -lc 'pnpm --filter @repo/db db:migrate'
          docker compose -f docker-compose.prod.yml --env-file .env run -T --rm --no-deps app sh -lc 'pnpm --filter @repo/clickhouse run db:migrate'
          docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate --remove-orphans
          EOF
