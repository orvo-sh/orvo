name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  KAMAL_HOST: ${{ secrets.PROD_SERVER_HOST }}
  KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
  KAMAL_SSH_KEY_PATH: ${{ github.workspace }}/.kamal/id_ed25519
  KAMAL_SSH_USER: ${{ secrets.PROD_SERVER_USER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.10.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Kamal secrets and SSH key
        env:
          PROD_CDN_BASE_URL: ${{ secrets.PROD_CDN_BASE_URL }}
          PROD_CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
          PROD_ENCRYPTION_SECRET: ${{ secrets.PROD_ENCRYPTION_SECRET }}
          PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
          PROD_GITHUB_CLIENT_ID: ${{ secrets.PROD_GITHUB_CLIENT_ID }}
          PROD_GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
          PROD_OTEL_INGEST_KEY: ${{ secrets.PROD_OTEL_INGEST_KEY }}
          PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
          PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          PROD_S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          PROD_S3_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
          PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
          PROD_S3_REGION: ${{ secrets.PROD_S3_REGION }}
          PROD_S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
          PROD_STRIPE_PRO_PRICE_ID: ${{ secrets.PROD_STRIPE_PRO_PRICE_ID }}
          PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          PROD_STRIPE_STARTER_PRICE_ID: ${{ secrets.PROD_STRIPE_STARTER_PRICE_ID }}
          PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
        run: |
          mkdir -p .kamal ~/.ssh
          printf '%s\n' "${PROD_SERVER_SSH_KEY}" > "${KAMAL_SSH_KEY_PATH}"
          chmod 600 "${KAMAL_SSH_KEY_PATH}"
          ssh-keyscan -H "${KAMAL_HOST}" >> ~/.ssh/known_hosts

          : > .kamal/secrets
          write_secret() {
            printf '%s=%s\n' "$1" "$2" >> .kamal/secrets
          }

          write_secret KAMAL_REGISTRY_PASSWORD "${{ github.token }}"
          write_secret PROD_CDN_BASE_URL "${PROD_CDN_BASE_URL}"
          write_secret PROD_CLICKHOUSE_URL "${PROD_CLICKHOUSE_URL}"
          write_secret PROD_ENCRYPTION_SECRET "${PROD_ENCRYPTION_SECRET}"
          write_secret PROD_GEMINI_API_KEY "${PROD_GEMINI_API_KEY}"
          write_secret PROD_GITHUB_CLIENT_ID "${PROD_GITHUB_CLIENT_ID}"
          write_secret PROD_GITHUB_CLIENT_SECRET "${PROD_GITHUB_CLIENT_SECRET}"
          write_secret PROD_OTEL_INGEST_KEY "${PROD_OTEL_INGEST_KEY}"
          write_secret PROD_POSTGRES_URL "${PROD_POSTGRES_URL}"
          write_secret PROD_RESEND_API_KEY "${PROD_RESEND_API_KEY}"
          write_secret PROD_S3_ACCESS_KEY_ID "${PROD_S3_ACCESS_KEY_ID}"
          write_secret PROD_S3_BUCKET_NAME "${PROD_S3_BUCKET_NAME}"
          write_secret PROD_S3_ENDPOINT "${PROD_S3_ENDPOINT}"
          write_secret PROD_S3_REGION "${PROD_S3_REGION}"
          write_secret PROD_S3_SECRET_ACCESS_KEY "${PROD_S3_SECRET_ACCESS_KEY}"
          write_secret PROD_STRIPE_PRO_PRICE_ID "${PROD_STRIPE_PRO_PRICE_ID}"
          write_secret PROD_STRIPE_SECRET_KEY "${PROD_STRIPE_SECRET_KEY}"
          write_secret PROD_STRIPE_STARTER_PRICE_ID "${PROD_STRIPE_STARTER_PRICE_ID}"
          write_secret PROD_STRIPE_WEBHOOK_SECRET "${PROD_STRIPE_WEBHOOK_SECRET}"

          chmod 600 .kamal/secrets

      - name: Write Postgres CA certificate
        env:
          PROD_POSTGRES_CA_CERT: ${{ secrets.PROD_POSTGRES_CA_CERT }}
        run: |
          mkdir -p deploy/certs
          printf '%s' "${PROD_POSTGRES_CA_CERT}" | base64 --decode > deploy/certs/do-postgres-ca.crt

      - name: Validate Kamal configs
        run: |
          for config_file in \
            config/deploy.app.yml \
            config/deploy.ingest.yml \
            config/deploy.telemetry-writer.yml \
            config/deploy.alerts-worker.yml
          do
            kamal -c "${config_file}" config > /dev/null
          done

      - name: Upload Postgres CA certificate
        run: |
          ssh -i "${KAMAL_SSH_KEY_PATH}" "${KAMAL_SSH_USER}@${KAMAL_HOST}" 'mkdir -p /opt/orvo/certs'
          scp -i "${KAMAL_SSH_KEY_PATH}" deploy/certs/do-postgres-ca.crt "${KAMAL_SSH_USER}@${KAMAL_HOST}:/opt/orvo/certs/do-postgres-ca.crt"

      - name: Build and deliver app image
        run: kamal -c config/deploy.app.yml build deliver

      - name: Run database migrations
        run: |
          kamal -c config/deploy.app.yml app exec -p 'pnpm --filter @repo/db db:migrate'
          kamal -c config/deploy.app.yml app exec -p 'pnpm --filter @repo/clickhouse run db:migrate'

      - name: Boot NATS accessory
        run: kamal -c config/deploy.ingest.yml accessory boot nats || kamal -c config/deploy.ingest.yml accessory reboot nats

      - name: Deploy alerts worker
        run: kamal -c config/deploy.alerts-worker.yml deploy

      - name: Deploy telemetry writer
        run: kamal -c config/deploy.telemetry-writer.yml deploy

      - name: Deploy app
        run: kamal -c config/deploy.app.yml deploy --skip-push

      - name: Deploy ingest
        run: kamal -c config/deploy.ingest.yml deploy

      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error https://app.orvo.sh/health
          curl --fail --silent --show-error https://ingest.orvo.sh/ready
