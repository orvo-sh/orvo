name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  KAMAL_HOST: ${{ secrets.PROD_SERVER_HOST }}
  KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
  KAMAL_SSH_USER: ${{ secrets.PROD_SERVER_USER }}
  DEPLOY_VERSION: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.10.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Kamal secrets and SSH key
        env:
          PROD_CDN_BASE_URL: ${{ secrets.PROD_CDN_BASE_URL }}
          PROD_CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
          PROD_ENCRYPTION_SECRET: ${{ secrets.PROD_ENCRYPTION_SECRET }}
          PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
          PROD_GITHUB_CLIENT_ID: ${{ secrets.PROD_GITHUB_CLIENT_ID }}
          PROD_GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
          PROD_OTEL_INGEST_KEY: ${{ secrets.PROD_OTEL_INGEST_KEY }}
          PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
          PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          PROD_S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          PROD_S3_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
          PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
          PROD_S3_REGION: ${{ secrets.PROD_S3_REGION }}
          PROD_S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
          PROD_STRIPE_PRO_PRICE_ID: ${{ secrets.PROD_STRIPE_PRO_PRICE_ID }}
          PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          PROD_STRIPE_STARTER_PRICE_ID: ${{ secrets.PROD_STRIPE_STARTER_PRICE_ID }}
          PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
        run: |
          export HOME="${RUNNER_TEMP}/kamal-home"
          export KAMAL_SSH_KEY_PATH="${HOME}/.ssh/kamal_id_ed25519"

          mkdir -p .kamal "${HOME}/.ssh"
          printf '%s\n' "${PROD_SERVER_SSH_KEY}" > "${KAMAL_SSH_KEY_PATH}"
          chmod 600 "${KAMAL_SSH_KEY_PATH}"
          touch "${HOME}/.ssh/known_hosts"
          ssh-keyscan -H "${KAMAL_HOST}" >> "${HOME}/.ssh/known_hosts"

          {
            echo "HOME=${HOME}"
            echo "KAMAL_SSH_KEY_PATH=${KAMAL_SSH_KEY_PATH}"
          } >> "${GITHUB_ENV}"

          : > .kamal/secrets
          write_secret() {
            printf '%s=%s\n' "$1" "$2" >> .kamal/secrets
          }

          write_secret KAMAL_REGISTRY_PASSWORD "${{ github.token }}"
          write_secret PROD_CDN_BASE_URL "${PROD_CDN_BASE_URL}"
          write_secret PROD_CLICKHOUSE_URL "${PROD_CLICKHOUSE_URL}"
          write_secret PROD_ENCRYPTION_SECRET "${PROD_ENCRYPTION_SECRET}"
          write_secret PROD_GEMINI_API_KEY "${PROD_GEMINI_API_KEY}"
          write_secret PROD_GITHUB_CLIENT_ID "${PROD_GITHUB_CLIENT_ID}"
          write_secret PROD_GITHUB_CLIENT_SECRET "${PROD_GITHUB_CLIENT_SECRET}"
          write_secret PROD_OTEL_INGEST_KEY "${PROD_OTEL_INGEST_KEY}"
          write_secret PROD_POSTGRES_URL "${PROD_POSTGRES_URL}"
          write_secret PROD_RESEND_API_KEY "${PROD_RESEND_API_KEY}"
          write_secret PROD_S3_ACCESS_KEY_ID "${PROD_S3_ACCESS_KEY_ID}"
          write_secret PROD_S3_BUCKET_NAME "${PROD_S3_BUCKET_NAME}"
          write_secret PROD_S3_ENDPOINT "${PROD_S3_ENDPOINT}"
          write_secret PROD_S3_REGION "${PROD_S3_REGION}"
          write_secret PROD_S3_SECRET_ACCESS_KEY "${PROD_S3_SECRET_ACCESS_KEY}"
          write_secret PROD_STRIPE_PRO_PRICE_ID "${PROD_STRIPE_PRO_PRICE_ID}"
          write_secret PROD_STRIPE_SECRET_KEY "${PROD_STRIPE_SECRET_KEY}"
          write_secret PROD_STRIPE_STARTER_PRICE_ID "${PROD_STRIPE_STARTER_PRICE_ID}"
          write_secret PROD_STRIPE_WEBHOOK_SECRET "${PROD_STRIPE_WEBHOOK_SECRET}"

          chmod 600 .kamal/secrets

      - name: Write Postgres CA certificate
        env:
          PROD_POSTGRES_CA_CERT: ${{ secrets.PROD_POSTGRES_CA_CERT }}
        run: |
          printf '%s' "${PROD_POSTGRES_CA_CERT}" | base64 --decode > "${RUNNER_TEMP}/do-postgres-ca.crt"

      - name: Validate Kamal configs
        run: |
          for config_file in \
            config/deploy.app.yml \
            config/deploy.ingest.yml \
            config/deploy.telemetry-writer.yml \
            config/deploy.alerts-worker.yml
          do
            kamal -c "${config_file}" config > /dev/null
          done

      - name: Verify clean workspace before build
        run: |
          test -z "$(git status --porcelain)"

      - name: Upload Postgres CA certificate
        run: |
          ssh -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${KAMAL_SSH_USER}@${KAMAL_HOST}" 'mkdir -p /opt/orvo/certs'
          scp -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${RUNNER_TEMP}/do-postgres-ca.crt" "${KAMAL_SSH_USER}@${KAMAL_HOST}:/opt/orvo/certs/do-postgres-ca.crt"

      - name: Build and push app image
        run: kamal build push -c config/deploy.app.yml --version "${DEPLOY_VERSION}"

      - name: Build and push ingest image
        run: kamal build push -c config/deploy.ingest.yml --version "${DEPLOY_VERSION}"

      - name: Build and push telemetry writer image
        run: kamal build push -c config/deploy.telemetry-writer.yml --version "${DEPLOY_VERSION}"

      - name: Build and push alerts worker image
        run: kamal build push -c config/deploy.alerts-worker.yml --version "${DEPLOY_VERSION}"

      - name: Pull app image to server
        run: kamal build pull -c config/deploy.app.yml --version "${DEPLOY_VERSION}"

      - name: Pull ingest image to server
        run: kamal build pull -c config/deploy.ingest.yml --version "${DEPLOY_VERSION}"

      - name: Pull telemetry writer image to server
        run: kamal build pull -c config/deploy.telemetry-writer.yml --version "${DEPLOY_VERSION}"

      - name: Pull alerts worker image to server
        run: kamal build pull -c config/deploy.alerts-worker.yml --version "${DEPLOY_VERSION}"

      - name: Prepare migration env file
        env:
          PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
          PROD_CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: |
          cat <<EOF > "${RUNNER_TEMP}/app.env"
          POSTGRES_URL=${PROD_POSTGRES_URL}
          CLICKHOUSE_URL=${PROD_CLICKHOUSE_URL}
          EOF

      - name: Upload migration env file
        run: |
          ssh -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${KAMAL_SSH_USER}@${KAMAL_HOST}" 'mkdir -p /opt/orvo/migrate'
          scp -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${RUNNER_TEMP}/app.env" "${KAMAL_SSH_USER}@${KAMAL_HOST}:/opt/orvo/migrate/app.env"

      - name: Run database migrations
        run: |
          ssh -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${KAMAL_SSH_USER}@${KAMAL_HOST}" \
            "docker run --rm --env-file /opt/orvo/migrate/app.env -v /opt/orvo/certs:/opt/orvo/certs:ro ghcr.io/orvo-sh/orvo-app:${DEPLOY_VERSION} sh -lc 'cd /repo && pnpm --filter @repo/db db:migrate && pnpm --filter @repo/clickhouse run db:migrate'"
          ssh -i "${KAMAL_SSH_KEY_PATH}" -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no "${KAMAL_SSH_USER}@${KAMAL_HOST}" 'rm -f /opt/orvo/migrate/app.env'

      - name: Boot NATS accessory
        run: kamal accessory boot nats -c config/deploy.ingest.yml || kamal accessory reboot nats -c config/deploy.ingest.yml

      - name: Deploy ingest
        run: kamal deploy -c config/deploy.ingest.yml --skip-push --version "${DEPLOY_VERSION}"

      - name: Deploy app
        run: kamal deploy -c config/deploy.app.yml --skip-push --version "${DEPLOY_VERSION}"

      - name: Deploy alerts worker
        run: kamal deploy -c config/deploy.alerts-worker.yml --skip-push --version "${DEPLOY_VERSION}"

      - name: Deploy telemetry writer
        run: kamal deploy -c config/deploy.telemetry-writer.yml --skip-push --version "${DEPLOY_VERSION}"

      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error https://app.orvo.sh/health
          curl --fail --silent --show-error https://ingest.orvo.sh/ready
