name: Publish Host Agent

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-host-agent.yml'
      - 'packages/host-agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.PROD_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host agent assets
        run: pnpm --filter @repo/host-agent build

      - name: Upload installer assets to CDN bucket
        run: |
          aws s3 cp packages/host-agent/dist/ "s3://${R2_BUCKET_NAME}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "host-agent/latest/*"

      - name: Purge Cloudflare cache
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://cdn.orvo.sh/host-agent/latest/install.sh","https://cdn.orvo.sh/host-agent/latest/manifest.json"]}'
