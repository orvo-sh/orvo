name: Publish Orvo images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - "apps/app/**"
      - "apps/ingest/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish linux/arm64 images
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/orvo-sh/orvo-app:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish ingest
        uses: docker/build-push-action@v6
        with:
          context: apps/ingest
          file: apps/ingest/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/orvo-sh/orvo-ingest:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
