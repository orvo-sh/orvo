name: Publish Orvo Agent

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            apps/host-agent/go.mod
            apps/host-agent/builder-config.yaml

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"

      - name: Test management CLI
        working-directory: apps/host-agent
        run: go test ./...

      - name: Generate collector distribution
        working-directory: apps/host-agent
        run: make generate-agent

      - name: Build binaries
        working-directory: apps/host-agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          AGENT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p "dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}"
          cd build/runtime
          go build -trimpath -ldflags="-s -w" -o "../../dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}/orvo-agent" .
          cd ../..
          go build -trimpath -ldflags="-s -w -X main.version=${AGENT_VERSION}" -o "dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}/orvo-agentctl" ./cmd/orvo-agentctl
          cp packaging/orvo-agent.service "dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}/"
          tar -C "dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}" -czf "dist/orvo-agent_${AGENT_VERSION}_linux_${GOARCH}.tar.gz" .

      - name: Attest artifact
        uses: actions/attest@v4
        with:
          subject-path: apps/host-agent/dist/orvo-agent_${{ steps.version.outputs.value }}_linux_${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvo-agent-linux-${{ matrix.arch }}
          path: apps/host-agent/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    environment: agent-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.PROD_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orvo-agent-linux-*
          path: dist
          merge-multiple: true

      - name: Build channel manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          AMD64_FILE="orvo-agent_${VERSION}_linux_amd64.tar.gz"
          ARM64_FILE="orvo-agent_${VERSION}_linux_arm64.tar.gz"
          AMD64_SHA="$(sha256sum "dist/${AMD64_FILE}" | cut -d' ' -f1)"
          ARM64_SHA="$(sha256sum "dist/${ARM64_FILE}" | cut -d' ' -f1)"
          {
            echo "version=${VERSION}"
            echo "linux_amd64_url=https://cdn.orvo.sh/agent/releases/v${VERSION}/${AMD64_FILE}"
            echo "linux_amd64_sha256=${AMD64_SHA}"
            echo "linux_arm64_url=https://cdn.orvo.sh/agent/releases/v${VERSION}/${ARM64_FILE}"
            echo "linux_arm64_sha256=${ARM64_SHA}"
          } > dist/stable.txt
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.tar.gz \
              dist/checksums.txt \
              dist/stable.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz \
              dist/checksums.txt \
              dist/stable.txt \
              --generate-notes \
              --title "Orvo Agent ${GITHUB_REF_NAME#agent-v}"
          fi

      - name: Upload immutable release to CDN
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          aws s3 cp dist/ "s3://${R2_BUCKET_NAME}/agent/releases/v${VERSION}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude '*' \
            --include '*.tar.gz' \
            --include 'checksums.txt' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Promote stable channel and installer
        run: |
          aws s3 cp dist/stable.txt "s3://${R2_BUCKET_NAME}/agent/channels/stable.txt" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'text/plain; charset=utf-8' \
            --cache-control 'public,max-age=60'
          aws s3 cp apps/host-agent/packaging/install.sh "s3://${R2_BUCKET_NAME}/agent/install.sh" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'text/x-shellscript; charset=utf-8' \
            --cache-control 'public,max-age=60'

      - name: Purge Cloudflare cache
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://cdn.orvo.sh/agent/install.sh","https://cdn.orvo.sh/agent/channels/stable.txt"]}'
