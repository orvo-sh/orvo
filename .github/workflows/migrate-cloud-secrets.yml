name: Migrate cloud secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Copy secrets to orvo-cloud
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.CLOUD_REPO_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      PROD_CDN_BASE_URL: ${{ secrets.PROD_CDN_BASE_URL }}
      PROD_CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
      PROD_ENCRYPTION_SECRET: ${{ secrets.PROD_ENCRYPTION_SECRET }}
      PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
      PROD_GITHUB_CLIENT_ID: ${{ secrets.PROD_GITHUB_CLIENT_ID }}
      PROD_GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
      PROD_OTEL_INGEST_KEY: ${{ secrets.PROD_OTEL_INGEST_KEY }}
      PROD_POSTGRES_CA_CERT: ${{ secrets.PROD_POSTGRES_CA_CERT }}
      PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
      PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
      PROD_S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
      PROD_S3_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      PROD_S3_REGION: ${{ secrets.PROD_S3_REGION }}
      PROD_S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
      PROD_SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
      PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
      PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
      PROD_STRIPE_PRO_PRICE_ID: ${{ secrets.PROD_STRIPE_PRO_PRICE_ID }}
      PROD_STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
      PROD_STRIPE_STARTER_PRICE_ID: ${{ secrets.PROD_STRIPE_STARTER_PRICE_ID }}
      PROD_STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Copy secrets without exposing values
        shell: bash
        run: |
          set_secret() {
            if [[ -z "$2" ]]; then
              echo "Source secret $1 is missing or empty." >&2
              exit 1
            fi
            printf '%s' "$2" | gh secret set "$1" --repo orvo-sh/orvo-cloud
          }

          set_secret CLOUDFLARE_API_KEY "${CLOUDFLARE_API_KEY}"
          set_secret CLOUDFLARE_ZONE_ID "${CLOUDFLARE_ZONE_ID}"
          set_secret PROD_CDN_BASE_URL "${PROD_CDN_BASE_URL}"
          set_secret PROD_CLICKHOUSE_URL "${PROD_CLICKHOUSE_URL}"
          set_secret PROD_ENCRYPTION_SECRET "${PROD_ENCRYPTION_SECRET}"
          set_secret PROD_GEMINI_API_KEY "${PROD_GEMINI_API_KEY}"
          set_secret PROD_GITHUB_CLIENT_ID "${PROD_GITHUB_CLIENT_ID}"
          set_secret PROD_GITHUB_CLIENT_SECRET "${PROD_GITHUB_CLIENT_SECRET}"
          set_secret PROD_OTEL_INGEST_KEY "${PROD_OTEL_INGEST_KEY}"
          set_secret PROD_POSTGRES_CA_CERT "${PROD_POSTGRES_CA_CERT}"
          set_secret PROD_POSTGRES_URL "${PROD_POSTGRES_URL}"
          set_secret PROD_RESEND_API_KEY "${PROD_RESEND_API_KEY}"
          set_secret PROD_S3_ACCESS_KEY_ID "${PROD_S3_ACCESS_KEY_ID}"
          set_secret PROD_S3_BUCKET_NAME "${PROD_S3_BUCKET_NAME}"
          set_secret PROD_S3_ENDPOINT "${PROD_S3_ENDPOINT}"
          set_secret PROD_S3_REGION "${PROD_S3_REGION}"
          set_secret PROD_S3_SECRET_ACCESS_KEY "${PROD_S3_SECRET_ACCESS_KEY}"
          set_secret PROD_SERVER_HOST "${PROD_SERVER_HOST}"
          set_secret PROD_SERVER_SSH_KEY "${PROD_SERVER_SSH_KEY}"
          set_secret PROD_SERVER_USER "${PROD_SERVER_USER}"
          set_secret PROD_STRIPE_PRO_PRICE_ID "${PROD_STRIPE_PRO_PRICE_ID}"
          set_secret PROD_STRIPE_SECRET_KEY "${PROD_STRIPE_SECRET_KEY}"
          set_secret PROD_STRIPE_STARTER_PRICE_ID "${PROD_STRIPE_STARTER_PRICE_ID}"
          set_secret PROD_STRIPE_WEBHOOK_SECRET "${PROD_STRIPE_WEBHOOK_SECRET}"
