name: Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in X.Y.Z format
        required: true
        type: string

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Agent version must match X.Y.Z." >&2
            exit 1
          fi

          TAG="agent-v${VERSION}"
          RELEASE_NOTES="apps/agent/releases/v${VERSION}.md"
          COMMIT="$(git rev-parse HEAD)"

          if [[ ! -s "${RELEASE_NOTES}" ]]; then
            echo "Missing release notes: ${RELEASE_NOTES}" >&2
            exit 1
          fi
          IFS= read -r RELEASE_TITLE < "${RELEASE_NOTES}"
          if [[ "${RELEASE_TITLE}" != "# Orvo Agent ${VERSION}" ]]; then
            echo "Release notes must start with '# Orvo Agent ${VERSION}'." >&2
            exit 1
          fi
          if ! grep -Fq "## ${VERSION} -" apps/agent/CHANGELOG.md; then
            echo "CHANGELOG.md has no ${VERSION} release entry." >&2
            exit 1
          fi

          APP_VERSION="$(sed -n 's/^const agentVersion = "\([^"]*\)";$/\1/p' \
            apps/app/src/lib/server/services/agent/methods/create-enrollment.ts)"
          if [[ "${APP_VERSION}" != "${VERSION}" ]]; then
            echo "The generated install command uses ${APP_VERSION:-no version}, expected ${VERSION}." >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists without a GitHub Release." >&2
            exit 1
          fi

          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: |
            apps/agent/go.mod
            apps/agent/builder-config.yaml

      - name: Test
        working-directory: apps/agent
        run: go test ./...

      - name: Generate collector distribution
        working-directory: apps/agent
        run: make generate-agent AGENT_VERSION=${{ needs.prepare.outputs.version }}

      - name: Build release archive
        working-directory: apps/agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE="orvo-agent_${VERSION}_linux_${GOARCH}"
          mkdir -p "dist/${PACKAGE}"
          (
            cd build/runtime
            go build -trimpath -ldflags='-s -w' -o "../../dist/${PACKAGE}/orvo-agent" .
          )
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${PACKAGE}/orvo-agentctl" ./cmd/orvo-agentctl
          cp packaging/orvo-agent.service "dist/${PACKAGE}/"
          printf '%s\n' "${VERSION}" > "dist/${PACKAGE}/VERSION"
          tar -C "dist/${PACKAGE}" -czf "dist/${PACKAGE}.tar.gz" .

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: apps/agent/dist/orvo-agent_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: orvo-agent-linux-${{ matrix.arch }}
          path: apps/agent/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Tag and publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.prepare.outputs.commit }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: orvo-agent-linux-*
          path: apps/agent/dist
          merge-multiple: true

      - name: Build checksums
        working-directory: apps/agent
        shell: bash
        run: |
          (
            cd dist
            sha256sum *.tar.gz > checksums.txt
          )

      - name: Create annotated tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" "${COMMIT}" -m "Orvo Agent ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        working-directory: apps/agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            dist/*.tar.gz dist/checksums.txt packaging/install.sh \
            --latest=false \
            --verify-tag \
            --title "Orvo Agent ${VERSION}" \
            --notes-file "releases/v${VERSION}.md"

      - name: Verify published release
        working-directory: apps/agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "${RELEASE_URL}/install.sh" -o "${VERIFY_DIR}/install.sh"
          sh -n "${VERIFY_DIR}/install.sh"

          gh release download "${TAG}" \
            --dir "${VERIFY_DIR}" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt'
          (
            cd "${VERIFY_DIR}"
            sha256sum --check checksums.txt
          )
