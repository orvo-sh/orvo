version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/infra/postgres/queries"
    schema:
      - "../../packages/db/drizzle"
      - "internal/infra/postgres/sqlc/schema"
    gen:
      go:
        package: "pgdb"
        out: "internal/infra/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
