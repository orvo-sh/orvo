name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          test -s "releases/${GITHUB_REF_NAME}.md"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            builder-config.yaml

      - name: Test
        run: go test ./...

      - name: Generate collector distribution
        run: make generate-agent AGENT_VERSION=${{ needs.prepare.outputs.version }}

      - name: Build release archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE="orvo-agent_${VERSION}_linux_${GOARCH}"
          mkdir -p "dist/${PACKAGE}"
          (
            cd build/runtime
            go build -trimpath -ldflags='-s -w' -o "../../dist/${PACKAGE}/orvo-agent" .
          )
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${PACKAGE}/orvo-agentctl" ./cmd/orvo-agentctl
          cp packaging/orvo-agent.service "dist/${PACKAGE}/"
          printf '%s\n' "$VERSION" > "dist/${PACKAGE}/VERSION"
          tar -C "dist/${PACKAGE}" -czf "dist/${PACKAGE}.tar.gz" .

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/orvo-agent_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: orvo-agent-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.PROD_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: orvo-agent-linux-*
          path: dist
          merge-multiple: true

      - name: Build checksums and stable manifest
        shell: bash
        run: |
          (
            cd dist
            sha256sum *.tar.gz > checksums.txt
          )
          AMD64_FILE="orvo-agent_${VERSION}_linux_amd64.tar.gz"
          ARM64_FILE="orvo-agent_${VERSION}_linux_arm64.tar.gz"
          AMD64_SHA="$(sha256sum "dist/${AMD64_FILE}" | cut -d' ' -f1)"
          ARM64_SHA="$(sha256sum "dist/${ARM64_FILE}" | cut -d' ' -f1)"
          {
            echo "version=${VERSION}"
            echo "linux_amd64_url=https://cdn.orvo.sh/agent/releases/v${VERSION}/${AMD64_FILE}"
            echo "linux_amd64_sha256=${AMD64_SHA}"
            echo "linux_arm64_url=https://cdn.orvo.sh/agent/releases/v${VERSION}/${ARM64_FILE}"
            echo "linux_arm64_sha256=${ARM64_SHA}"
          } > dist/stable.txt

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --title "Orvo Agent ${VERSION}" \
              --notes-file "releases/${GITHUB_REF_NAME}.md"
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/checksums.txt \
              --draft \
              --verify-tag \
              --title "Orvo Agent ${VERSION}" \
              --notes-file "releases/${GITHUB_REF_NAME}.md"
          fi

      - name: Validate CDN configuration
        shell: bash
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION R2_BUCKET_NAME R2_ENDPOINT CLOUDFLARE_ZONE_ID CLOUDFLARE_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Upload immutable release to CDN
        run: |
          aws s3 cp dist/ "s3://${R2_BUCKET_NAME}/agent/releases/v${VERSION}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude '*' \
            --include '*.tar.gz' \
            --include 'checksums.txt' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Promote stable channel and installer
        run: |
          aws s3 cp dist/stable.txt "s3://${R2_BUCKET_NAME}/agent/channels/stable.txt" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'text/plain; charset=utf-8' \
            --cache-control 'public,max-age=60'
          aws s3 cp packaging/install.sh "s3://${R2_BUCKET_NAME}/agent/install.sh" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'text/x-shellscript; charset=utf-8' \
            --cache-control 'public,max-age=60'

      - name: Purge Cloudflare cache
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"files":["https://cdn.orvo.sh/agent/install.sh","https://cdn.orvo.sh/agent/channels/stable.txt"]}'

      - name: Verify CDN release
        run: |
          curl --fail --retry 5 --retry-delay 2 \
            "https://cdn.orvo.sh/agent/releases/v${VERSION}/checksums.txt" >/dev/null
          curl --fail --retry 5 --retry-delay 2 \
            "https://cdn.orvo.sh/agent/channels/stable.txt" | grep -Fx "version=${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
