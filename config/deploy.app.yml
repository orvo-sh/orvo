service: orvo-app
image: orvo-sh/orvo-app

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
  keys:
    - <%= ENV.fetch("KAMAL_SSH_KEY_PATH") %>
  config: false

builder:
  arch: arm64
  context: .
  dockerfile: apps/app/Dockerfile

proxy:
  host: app.orvo.sh
  app_port: 3000
  ssl: true
  forward_headers: true
  healthcheck:
    path: /health
    interval: 3
    timeout: 3

volumes:
  - /opt/orvo/certs:/opt/orvo/certs:ro

env:
  clear:
    SELF_HOSTED: 'false'
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    ORIGIN: https://app.orvo.sh
    INGEST_BASE_URL: https://ingest.orvo.sh
    PUBLIC_ORVO_OTLP_BASE_URL: https://ingest.orvo.sh
    PROD_OTEL_BASE_URL: https://ingest.orvo.sh
  secret:
    - POSTGRES_URL:PROD_POSTGRES_URL
    - CLICKHOUSE_URL:PROD_CLICKHOUSE_URL
    - ENCRYPTION_SECRET:PROD_ENCRYPTION_SECRET
    - GITHUB_CLIENT_ID:PROD_GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET:PROD_GITHUB_CLIENT_SECRET
    - RESEND_API_KEY:PROD_RESEND_API_KEY
    - STRIPE_SECRET_KEY:PROD_STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET:PROD_STRIPE_WEBHOOK_SECRET
    - STRIPE_STARTER_PRICE_ID:PROD_STRIPE_STARTER_PRICE_ID
    - STRIPE_PRO_PRICE_ID:PROD_STRIPE_PRO_PRICE_ID
    - S3_ACCESS_KEY_ID:PROD_S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY:PROD_S3_SECRET_ACCESS_KEY
    - S3_ENDPOINT:PROD_S3_ENDPOINT
    - S3_REGION:PROD_S3_REGION
    - S3_BUCKET_NAME:PROD_S3_BUCKET_NAME
    - CDN_BASE_URL:PROD_CDN_BASE_URL
    - PROD_OTEL_INGEST_KEY
