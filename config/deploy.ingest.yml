service: orvo-ingest
image: orvo-sh/orvo-ingest

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
  keys:
    - <%= ENV.fetch("KAMAL_SSH_KEY_PATH") %>
  config: false

builder:
  arch: amd64
  context: apps/ingest
  dockerfile: apps/ingest/Dockerfile

proxy:
  host: ingest.orvo.sh
  app_port: 4318
  ssl: true
  forward_headers: true
  healthcheck:
    path: /ready
    interval: 3
    timeout: 3

volumes:
  - /opt/orvo/certs:/opt/orvo/certs:ro

env:
  clear:
    APP_ENVIRONMENT: production
    INGEST_HTTP_HOST: 0.0.0.0
    INGEST_HTTP_PORT: '4318'
    PROD_OTEL_BASE_URL: https://ingest.orvo.sh
  secret:
    - POSTGRES_URL:PROD_POSTGRES_URL
    - CLICKHOUSE_URL:PROD_CLICKHOUSE_URL
    - PROD_OTEL_INGEST_KEY
